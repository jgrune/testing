name: Build & Release APK

on:
  push:
    branches:
      - claude/tv-remote-button-override-I6e6t
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tv-button-override.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-button-override-apk
          path: tv-button-override.apk
          retention-days: 30

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "TV Button Override — Latest Build"
          body: |
            ## TV Button Override for ONN Android TV

            ### Install via Downloader App
            1. Open the **Downloader** app on your ONN TV
            2. Enter this URL in the address bar:
               `https://github.com/${{ github.repository }}/releases/download/latest-build/tv-button-override.apk`
            3. Download and install the APK
            4. Open **TV Button Override** from your app list
            5. Tap **Enable Accessibility Service** when prompted
            6. Press **Detect & Map a Remote Button** to get started

            ### What it does
            Remaps any button on your ONN remote (Free TV, YouTube, Netflix, Disney+, Paramount+, etc.) to open a different app of your choice.

            > Built from commit ${{ github.sha }}
          files: tv-button-override.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          prerelease: false
